events {}

http {
  # Allow moderately sized uploads for KB files
  client_max_body_size 50m;

  # Upgrade handling (for websockets/streams)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Shared auth header passthrough (prefer Authorization header, fallback to token cookie)
  map $cookie_token $auth_cookie {
    default "";
    "~.+" "Bearer $cookie_token";
  }

  map $http_authorization $auth_header {
    default $http_authorization;
    "" $auth_cookie;
  }

  log_format upstream_logging '[$time_local] $remote_addr to: $upstream_addr: $request $status'
                              ' upstream_response_time $upstream_response_time';

  access_log /var/log/nginx/access.log upstream_logging;
  
  # Docker internal DNS resolver
  resolver 127.0.0.11 valid=30s;

  # HTTP server - Redirect all traffic to HTTPS
  server {
    listen 80;
    server_name chatbotaitelu.com www.chatbotaitelu.com;

    # ACME HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
    }

    # Redirect to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server
  server {
    listen 443 ssl;
    server_name chatbotaitelu.com www.chatbotaitelu.com;

    ssl_certificate /etc/letsencrypt/live/chatbotaitelu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbotaitelu.com/privkey.pem;

    # Basic SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /api/auth/ {
      set $auth_backend authentication-service;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://$auth_backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/broker/ {
      set $broker_backend broker-service;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://$broker_backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/mail/ {
      set $mail_backend mail-service;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://$mail_backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/logger/ {
      set $logger_backend logger-service;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://$logger_backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
      set $proxy_backend flowise-proxy;
      proxy_pass http://$proxy_backend:4000;
      proxy_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/chat/ {
      set $proxy_backend flowise-proxy;
      proxy_pass http://$proxy_backend:4000;
      proxy_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/kb/ {
      set $proxy_backend flowise-proxy;
      proxy_pass http://$proxy_backend:4000;
      proxy_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Internal endpoints ----------
    location /flowise/ {
      set $flowise_backend flowise;
      proxy_pass http://$flowise_backend:3000/;
      proxy_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/ {
      set $grafana_backend grafana;
      proxy_pass http://$grafana_backend:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Frontend (Catch-all) ----------
    location / {
      set $frontend_backend front-end;
      proxy_pass http://$frontend_backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
